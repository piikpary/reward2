services:
  app:
    image: reward2-api:local
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - reward2_vendor:/var/www/vendor
    depends_on:
      - mysql
    networks:
      - reward2
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reward2
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: reward2
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: reward2
      MYSQL_PASSWORD: reward2_password
    ports:
      - "3307:3306"
    volumes:
      - reward2_mysql:/var/lib/mysql
    networks:
      - reward2
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 1G

  queue:
    image: reward2-api:local
    working_dir: /var/www
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
      - reward2_vendor:/var/www/vendor
    depends_on:
      - app
      - mysql
    networks:
      - reward2
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

  scheduler:
    image: reward2-api:local
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
      - reward2_vendor:/var/www/vendor
    depends_on:
      - app
      - mysql
    networks:
      - reward2
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  reward2:
    driver: overlay

volumes:
  reward2_mysql:
  reward2_vendor: