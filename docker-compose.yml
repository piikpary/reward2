services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reward2-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - reward2_vendor:/var/www/vendor
    depends_on:
      - mysql
    networks:
      - reward2

  nginx:
    image: nginx:alpine
    container_name: reward2-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reward2

  mysql:
    image: mysql:8.0
    container_name: reward2-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: reward2
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: reward2
      MYSQL_PASSWORD: reward2_123
    volumes:
      - reward2_mysql:/var/lib/mysql
    networks:
      - reward2

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reward2-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
      - reward2_vendor:/var/www/vendor
    depends_on:
      - app
      - mysql
    networks:
      - reward2

networks:
  reward2:

volumes:
  reward2_mysql:
  reward2_vendor: