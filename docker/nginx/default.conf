upstream reward2_backend {
    zone reward2_backend 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server app:9000 resolve
        max_fails=3
        fail_timeout=10s;
}

# Original protocol received by the load balancer.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $forwarded_proto $fastcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    listen [::]:80;

    server_name wrw.app _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Public Laravel uploaded files
    location /storage/ {
        try_files $uri =404;

        access_log off;
        expires 30d;

        add_header Cache-Control
            "public, max-age=2592000";
    }

    # Laravel application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass reward2_backend;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT
            $document_root;

        fastcgi_param HTTP_HOST
            $host;

        fastcgi_param HTTP_X_FORWARDED_HOST
            $host;

        fastcgi_param HTTP_X_FORWARDED_PROTO
            $forwarded_proto;

        fastcgi_param HTTP_X_FORWARDED_FOR
            $http_x_forwarded_for;

        fastcgi_param HTTPS
            $fastcgi_https;
    }

    # Block hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
